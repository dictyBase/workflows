name: Composite deploy for backend workflow
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
        description: backend application to be deployed
      repository:
        required: true
        type: string
        description: "Repository name with owner"
      ref:
        required: true
        type: string
        description: "The branch, tag, or SHA to checkout"
      dockerfile:
        required: true
        type: string
        description: "Location of the Dockerfile"
      docker_image: 
        type: string
        required: true
        description: "Docker image name"
      cluster:
        required: true
        type: string
        description: "name of kubernetes cluster"
      cluster_state_storage:
        required: true
        type: string
        description: "location of cluster state"
      project: 
        type: string
        required: true
        description: "Project name"
      stack:
        type: string
        required: true
        description: "Name of the Pulumi stack to use"
      docker_namespace: 
        type: string
        default: dictybase
        description: "Docker namespace"
      application_type:
        type: string
        default: microservice
        description: "Type of the application to be deployed"
      environment:
        type: string
        default: development
        description: "Deployment environment"
      runner:
        type: string
        default: ubuntu-latest
        description: "Runner for the job"
      kops_version:
        type: string
        default: "1.29.2"
        description: "kOps version used to manage the cluster"
      kubectl_version:
        type: string
        default: "1.28.8"
        description: "kubectl version used against the cluster"
      pulumi_version:
        type: string
        default: "3.108.0"
        description: "Pulumi CLI version used for the deployment"
      cluster_ops_ref:
        type: string
        default: develop
        description: "Git ref of dictyBase/cluster-ops to clone"
      dagger_ref:
        type: string
        default: develop
        description: "Git ref of dictybase-docker/dagger-of-dcr to checkout"

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    env:
      JUST_UNSTABLE: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: free disk space
        run: |
          docker system prune -af --volumes
          sudo rm -rf /usr/local/share/.cache/yarn
          sudo rm -rf /home/runner/.cache
          df -h
      - name: checkout dagger repo with justfile 
        uses: actions/checkout@v4
        with: 
          repository: dictybase-docker/dagger-of-dcr
          ref: ${{ inputs.dagger_ref }}
      - name: setup just binary
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: google-github-actions/auth@v2
        id: gcp_authentication
        with:
          credentials_json: ${{ secrets.DEPLOY_SA_KEY }}
      - name: deploy backend
        if: ${{ inputs.application_type == 'backend' || inputs.application_type == 'microservice' }}
        run: |
          just deploy-backend \
            --cluster ${{ inputs.cluster }} \
            --cluster-state ${{ inputs.cluster_state_storage }} \
            --pulumi-state ${{ vars.PULUMI_STATE_STORAGE }} \
            --gcp-credentials-file ${{ steps.gcp_authentication.outputs.credentials_file_path }} \
            --ref ${{ inputs.ref }} \
            --app ${{ inputs.app }} \
            --docker-image ${{ inputs.docker_image }} \
            --docker-namespace ${{ inputs.docker_namespace }} \
            --dockerfile ${{ inputs.dockerfile }} \
            --project ${{ inputs.project }} \
            --stack ${{ inputs.stack }} \
            --environment ${{ inputs.environment }} \
            --repository ${{ inputs.repository }} \
            --kops-version ${{ inputs.kops_version }} \
            --kubectl-version ${{ inputs.kubectl_version }} \
            --pulumi-version ${{ inputs.pulumi_version }} \
            --cluster-ops-ref ${{ inputs.cluster_ops_ref }} \
            --token ${{ secrets.GH_DEPLOY_TOKEN }} \
            --user ${{ secrets.DOCKERHUB_USER }} \
            --pass ${{ secrets.DOCKER_PASS }}
      - name: deploy frontend
        if: ${{ inputs.application_type == 'frontend' }}
        run: |
          just deploy-frontend \
            --cluster ${{ inputs.cluster }} \
            --cluster-state ${{ inputs.cluster_state_storage }} \
            --pulumi-state ${{ vars.PULUMI_STATE_STORAGE }} \
            --gcp-credentials-file ${{ steps.gcp_authentication.outputs.credentials_file_path }} \
            --ref ${{ inputs.ref }} \
            --app ${{ inputs.app }} \
            --docker-image ${{ inputs.docker_image }} \
            --docker-namespace ${{ inputs.docker_namespace }} \
            --dockerfile ${{ inputs.dockerfile }} \
            --project ${{ inputs.project }} \
            --stack ${{ inputs.stack }} \
            --environment ${{ inputs.environment }} \
            --repository ${{ inputs.repository }} \
            --kops-version ${{ inputs.kops_version }} \
            --kubectl-version ${{ inputs.kubectl_version }} \
            --pulumi-version ${{ inputs.pulumi_version }} \
            --cluster-ops-ref ${{ inputs.cluster_ops_ref }} \
            --token ${{ secrets.GH_DEPLOY_TOKEN }} \
            --user ${{ secrets.DOCKERHUB_USER }} \
            --pass ${{ secrets.DOCKER_PASS }}
